name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'assets/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'data/**'
      - 'assets/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare fully local web bundle
        run: python3 android/prepare_web.py

      - name: Restore stable signing key
        run: base64 -d android/signing/arshia-espanol.jks.b64 > android/signing/arshia-espanol.jks

      - name: Build optimized release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Arshia-Espanol.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arshia-Espanol-APK
          path: Arshia-Espanol.apk
          if-no-files-found: error
